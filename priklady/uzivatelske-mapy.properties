# Uživatelské mapy pro Geokuk
#
# Soubor uložte jako uzivatelske-mapy.properties vedle geokuk.jar a zapněte
# v něm mapy, které chcete (smažte # na začátku řádků). Mapy se objeví
# v menu Mapy ve skupině „Uživatelské mapy“. Po změně souboru Geokuk
# restartujte, chyby v souboru ohlásí při startu.
#
# Každá mapa má své označení (malá písmena bez diakritiky, číslice, pomlčky)
# a vlastnosti:
#   <označení>.nazev    název v menu (povinné)
#   <označení>.url      adresa dlaždice, {z} měřítko, {x} a {y} číslo dlaždice (povinné)
#   <označení>.popis    bublinová nápověda v menu
#   <označení>.min      nejmenší měřítko, výchozí 0
#   <označení>.max      největší měřítko, nejvýš 22, výchozí 18
#   <označení>.maxauto  největší měřítko při automatickém přibližování,
#                       výchozí stejné jako max
#   <označení>.klavesa  podtržené písmeno v menu (např. u)
#   <označení>.zkratka  klávesová zkratka (např. u, F5, ctrl U), nesmí
#                       kolidovat s vestavěnými mapami
#   <označení>.atribuce text vpravo dole v mapě (např. © autor mapy)
#   <označení>.hromadne ano, pokud mapu jde stahovat hromadně do cache
#                       (Mapy → Postahovat dlaždice), výchozí ne
#   <označení>.hlavicka.<jméno>  hlavička požadavku (např. Referer,
#                       User-Agent), {verze} se nahradí verzí Geokuku
#
# Soubor ukládejte v kódování UTF-8.

# Thunderforest OpenCycleMap s vlastním klíčem (zdarma po registraci
# na https://www.thunderforest.com/)
#cyklo.nazev=Cyklomapa Thunderforest
#cyklo.url=https://tile.thunderforest.com/cycle/{z}/{x}/{y}.png?apikey=VAS_KLIC
#cyklo.max=22
#cyklo.atribuce=Mapa © Thunderforest, data © přispěvatelé OpenStreetMap

# Vestavěné mapy zapsané jako uživatelské, například když poskytovatel
# změní adresu a oprava v Geokuku ještě nevyšla.
#turisticka.atribuce=© Seznam.cz, a.s. a další
#turisticka.nazev=Turistická (vlastní)
#turisticka.popis=Turistická mapa.
#turisticka.url=http://mapserver.mapy.cz/turist-m/{z}-{x}-{y}
#turisticka.max=19
#turisticka.klavesa=u
#turisticka.zkratka=u
#turisticka.hlavicka.Referer=https://en.mapy.com/
#turisticka.hromadne=ano

#zakladni.atribuce=© Seznam.cz, a.s. a další
#zakladni.nazev=Základní (vlastní)
#zakladni.url=http://mapserver.mapy.cz/base-m/{z}-{x}-{y}
#zakladni.hlavicka.Referer=https://en.mapy.com/
#zakladni.max=19

#letecka.atribuce=© Seznam.cz, a.s. a další
#letecka.nazev=Letecká (vlastní)
#letecka.url=http://mapserver.mapy.cz/ophoto-m/{z}-{x}-{y}
#letecka.hlavicka.Referer=https://en.mapy.com/
#letecka.max=20

#zimni.atribuce=© Seznam.cz, a.s. a další
#zimni.nazev=Turistická zimní (vlastní)
#zimni.url=http://mapserver.mapy.cz/wturist_winter-m/{z}-{x}-{y}
#zimni.hlavicka.Referer=https://en.mapy.com/
#zimni.max=19

#osm.nazev=OpenStreetMap (vlastní)
#osm.url=https://tile.openstreetmap.org/{z}/{x}/{y}.png
#osm.max=19
#osm.atribuce=© přispěvatelé OpenStreetMap
#osm.hlavicka.User-Agent=Geokuk/{verze} (+https://github.com/geokuk-community/geokuk)

#freemap.nazev=Slovensko turistická (vlastní)
#freemap.url=https://outdoor.tiles.freemap.sk/{z}/{x}/{y}.png
#freemap.max=18
#freemap.atribuce=© Freemap Slovakia, data © přispěvatelé OpenStreetMap
