# Zdroje mapových dlaždic a hlavičky požadavků.
#
# Program si při startu stáhne aktuální verzi tohoto souboru z repozitáře,
# takže oprava zdroje nevyžaduje nové vydání. Vlastní úpravy patří do
# souboru mapy.properties vedle geokuk.jar, ten má přednost.
#
# <VRSTVA>.url  adresa dlaždice, {z} měřítko, {x} a {y} číslo dlaždice
# hlavicka.<konec názvu serveru>.<hlavička>  hlavička požadavku, {verze} je verze programu

BASE_M.url=http://mapserver.mapy.cz/base-m/{z}-{x}-{y}
TURIST_M.url=http://mapserver.mapy.cz/turist-m/{z}-{x}-{y}
OPHOTO_M.url=http://mapserver.mapy.cz/ophoto-m/{z}-{x}-{y}
WTURIST_WINTER_M.url=http://mapserver.mapy.cz/wturist_winter-m/{z}-{x}-{y}
OPHOTO1415_M.url=http://mapserver.mapy.cz/ophoto1415-m/{z}-{x}-{y}
OPHOTO1012_M.url=http://mapserver.mapy.cz/ophoto1012-m/{z}-{x}-{y}
OPHOTO0406_M.url=http://mapserver.mapy.cz/ophoto0406-m/{z}-{x}-{y}
OPHOTO0203_M.url=http://mapserver.mapy.cz/ophoto0203-m/{z}-{x}-{y}
ZEMEPIS_M.url=http://mapserver.mapy.cz/zemepis-m/{z}-{x}-{y}
BASE_M_TRAF_DOWN.url=http://mapserver.mapy.cz/base-m-traf-down/{z}-{x}-{y}
ARMY2_M.url=http://mapserver.mapy.cz/army2-m/{z}-{x}-{y}
OPEN_STREET.url=https://tile.openstreetmap.org/{z}/{x}/{y}.png
TUR_FREEMAP_SK_T.url=https://outdoor.tiles.freemap.sk/{z}/{x}/{y}.png
TUR_FREEMAP_SK_F.url=https://ortofoto.tiles.freemap.sk/{z}/{x}/{y}.jpg
OPEN_CYKLO.url=https://c.tile.thunderforest.com/cycle/{z}/{x}/{y}.png?apikey=6a53e8b25d114a5e9216df5bf9b5e9c8

hlavicka.mapy.cz.Referer=https://en.mapy.com/
hlavicka.openstreetmap.org.User-Agent=Geokuk/{verze} (+https://github.com/geokuk-community/geokuk)
