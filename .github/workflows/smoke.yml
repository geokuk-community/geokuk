name: Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        # Noční běh jen na Linuxu, Windows a macOS se spouští ručně.
        os: ${{ github.event_name == 'schedule' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1400x900x24" ./mvnw -B -P smoke verify

      - name: Smoke test
        if: runner.os == 'Windows'
        run: ./mvnw.cmd -B -P smoke verify

      - name: Jednotkové testy
        if: runner.os == 'macOS'
        run: ./mvnw -B test

      - name: Zprávy, logy a snímky obrazovky
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ runner.os }}
          path: |
            target/smoke/*/*.properties
            target/smoke/*/*.log
            target/smoke/*/*.png
            target/smoke/*/data/log/
            target/failsafe-reports/
