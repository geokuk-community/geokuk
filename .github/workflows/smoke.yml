name: Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        # Noční běh jen na Linuxu, Windows a macOS se spouští ručně.
        os: ${{ github.event_name == 'schedule' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1400x900x24" ./mvnw -B -P smoke verify -Dgeokuk.testy.limitSekund=600

      # Runner na Windows občas zastaví celou JVM na sekundy; spadlý test se jednou zopakuje a ve výstupu je vidět jako Flakes.
      - name: Smoke test
        if: runner.os == 'Windows'
        run: ./mvnw.cmd -B -P smoke verify "-Dfailsafe.rerunFailingTestsCount=1" "-Dgeokuk.testy.limitSekund=600"

      - name: Opakované testy do souhrnu
        if: always() && runner.os == 'Windows'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('target/failsafe-reports/TEST-*.xml'):
              for t in ET.parse(f).getroot().iter('testcase'):
                  opakovani = [e for e in t if e.tag in ('flakyFailure', 'flakyError')]
                  if opakovani:
                      zprava = (opakovani[0].get('message') or '').splitlines()[0][:300] if opakovani[0].get('message') else ''
                      print('- ⚠️ %s.%s prošel až napodruhé: %s' % (t.get('classname', '').split('.')[-1], t.get('name'), zprava))
          PY

      - name: Jednotkové testy
        if: runner.os == 'macOS'
        run: ./mvnw -B test

      - name: Zprávy, logy a snímky obrazovky
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ runner.os }}
          path: |
            target/smoke/*/*.properties
            target/smoke/*/*.log
            target/smoke/*/*.png
            target/smoke/*/data/log/
            target/failsafe-reports/
