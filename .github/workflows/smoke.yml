name: Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1400x900x24" ./mvnw -B -P smoke verify

      - name: Smoke test
        if: runner.os == 'Windows'
        run: ./mvnw.cmd -B -P smoke verify

      - name: Zprávy, logy a snímky obrazovky
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ runner.os }}
          path: |
            target/smoke/*/*.properties
            target/smoke/*/*.log
            target/smoke/*/*.png
            target/smoke/*/data/log/
            target/failsafe-reports/
