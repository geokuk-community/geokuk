name: Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Smoke test
        run: xvfb-run -a -s "-screen 0 1400x900x24" ./mvnw -B -P smoke verify

      - name: Zprávy, logy a snímky obrazovky
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: |
            target/smoke/*/*.properties
            target/smoke/*/*.log
            target/smoke/*/*.png
            target/smoke/*/data/log/
            target/failsafe-reports/
