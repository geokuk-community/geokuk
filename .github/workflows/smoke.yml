name: Smoke

on:
  workflow_dispatch:
    inputs:
      zkouska_issue:
        description: "Zkouška issue při červeném nočním běhu: nic nezakládá, jen vypíše text do souhrnu"
        type: boolean
        default: false
  schedule:
    - cron: "17 2 * * *"
  # Po sloučení do main jednou na Linuxu.
  push:
    branches: [main]
    paths:
      - src/**
      - pom.xml
      - .mvn/**
      - .github/workflows/smoke.yml
  # Změna závislostí může rozbít spuštěný program, i když projdou testy.
  pull_request:
    branches: [main, "release/**"]
    paths:
      - pom.xml
      - .mvn/**
      - mvnw
      - mvnw.cmd
      - .github/workflows/smoke.yml
      - src/test/java/cz/geokuk/smoke/**
      - src/test/java/cz/geokuk/testy/**

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        # Noční běh, push na main a PR jen na Linuxu, Windows a macOS se spouští ručně.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Smoke test
        if: runner.os == 'Linux'
        # U PR a pushe na main běží jednotkové testy už v jobu Build, tady jen smoke.
        run: xvfb-run -a -s "-screen 0 1400x900x24" ./mvnw -B -P smoke verify -Dgeokuk.testy.limitSekund=600 ${{ (github.event_name == 'pull_request' || github.event_name == 'push') &&'-Dtest=NoSuch -Dsurefire.failIfNoSpecifiedTests=false' || '' }}

      # Runner na Windows občas zastaví celou JVM na sekundy; spadlý test se jednou zopakuje a ve výstupu je vidět jako Flakes.
      - name: Smoke test
        if: runner.os == 'Windows'
        run: ./mvnw.cmd -B -P smoke verify "-Dfailsafe.rerunFailingTestsCount=1" "-Dgeokuk.testy.limitSekund=600"

      - name: Opakované testy do souhrnu
        if: always() && runner.os == 'Windows'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('target/failsafe-reports/TEST-*.xml'):
              for t in ET.parse(f).getroot().iter('testcase'):
                  opakovani = [e for e in t if e.tag in ('flakyFailure', 'flakyError')]
                  if opakovani:
                      zprava = (opakovani[0].get('message') or '').splitlines()[0][:300] if opakovani[0].get('message') else ''
                      print('- ⚠️ %s.%s prošel až napodruhé: %s' % (t.get('classname', '').split('.')[-1], t.get('name'), zprava))
          PY

      - name: Odezva EDT do souhrnu
        if: always() && runner.os != 'macOS'
        continue-on-error: true
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, os
          print('### Odezva EDT (ms) – ' + os.environ.get('RUNNER_OS', ''))
          print('| scénář | nejdelší | při startu | při přepnutí vzhledu | událostí ≥ 500 ms | pauzy JVM |')
          print('|---|---|---|---|---|---|')
          for f in sorted(glob.glob('target/smoke/*/*.properties')):
              p = {}
              with open(f, encoding='utf-8', errors='replace') as h:
                  for r in h:
                      if '=' in r and not r.startswith(('#', ' ')):
                          k, v = r.split('=', 1)
                          p[k.strip()] = v.strip()
              if 'edt.nejdelsiMs' in p:
                  pomalych = sum(1 for k in p if k.startswith('edt.pomala.'))
                  print('| %s/%s | %s | %s | %s | %d | %s |' % (os.path.basename(os.path.dirname(f)), os.path.basename(f)[:-11], p['edt.nejdelsiMs'], p.get('edt.startMs', ''), p.get('edt.vzhledMs', ''), pomalych, p.get('edt.pauzyJvm', '')))
          PY

      - name: Jednotkové testy
        if: runner.os == 'macOS'
        run: ./mvnw -B test

      - name: Zprávy, logy a snímky obrazovky
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ runner.os }}
          path: |
            target/smoke/*/*.properties
            target/smoke/*/*.log
            target/smoke/*/*.png
            target/smoke/*/data/log/
            target/failsafe-reports/
            target/surefire-reports/

  issue:
    # Jen noční běh; ruční běh s volbou zkouska_issue jen vypíše text do souhrnu.
    needs: smoke
    if: always() && ((github.event_name == 'schedule' && needs.smoke.result == 'failure') || (github.event_name == 'workflow_dispatch' && inputs.zkouska_issue))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NAZEV: Noční Smoke je červený
      ZKOUSKA: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Issue s výsledkem
        run: |
          BEH="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          mkdir zpravy
          gh run download "$GITHUB_RUN_ID" -n smoke-Linux -D zpravy || true
          TESTY=$(python3 -I - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in sorted(glob.glob('zpravy/**/TEST-*.xml', recursive=True)):
              for t in ET.parse(f).getroot().iter('testcase'):
                  if any(e.tag in ('failure', 'error') for e in t):
                      print('- %s.%s' % (t.get('classname', '').split('.')[-1], t.get('name')))
          PY
          )
          {
            echo "Noční Smoke ($(date -u +%F)) skončil chybou."
            echo
            echo "Selhané testy:"
            if [ -n "$TESTY" ]; then echo "$TESTY"; else echo "- nezjištěno, viz log"; fi
            echo
            echo "Běh: $BEH"
          } > telo.md
          if [ "$ZKOUSKA" = true ]; then
            { echo "### Zkouška issue (nic se nezakládá)"; cat telo.md; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          CISLO=$(gh issue list --state open --search "in:title \"$NAZEV\"" --json number,title \
            --jq ".[] | select(.title == \"$NAZEV\") | .number" | head -1)
          if [ -n "$CISLO" ]; then
            gh issue comment "$CISLO" --body-file telo.md
          else
            gh issue create --title "$NAZEV" --body-file telo.md
          fi
