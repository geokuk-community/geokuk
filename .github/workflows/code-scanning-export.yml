name: Export Code scanning

on:
  workflow_run:
    workflows: ["CodeQL"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *"

permissions:
  contents: read
  security-events: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Repo je veřejné: do logu a souhrnu jen počty, žádná pravidla, soubory ani popisy.
      - name: Počty otevřených alertů
        run: |
          gh api --paginate "repos/${{ github.repository }}/code-scanning/alerts?state=open&per_page=100" \
            | jq -s '[.[][] | {zavaznost: (.rule.security_severity_level // .rule.severity), nastroj: .tool.name}]
                | {celkem: length,
                   podle_zavaznosti: (group_by(.zavaznost) | map({(.[0].zavaznost // "neuvedeno"): length}) | add // {}),
                   podle_nastroje: (group_by(.nastroj) | map({(.[0].nastroj // "neuvedeno"): length}) | add // {})}' \
            > pocty.json
          cat pocty.json

      - name: Poslední analýzy
        run: |
          gh api "repos/${{ github.repository }}/code-scanning/analyses?per_page=5" \
            | jq '[.[] | {datum: .created_at, commit: .commit_sha[0:7], nastroj: .tool.name, vysledku: .results_count}]' \
            > analyzy.json
          cat analyzy.json

      - name: Souhrn
        run: |
          {
            echo "## Code scanning: otevřené alerty"
            echo
            echo "Celkem: $(jq .celkem pocty.json)"
            echo
            echo "| Závažnost | Počet |"
            echo "|---|---|"
            jq -r '.podle_zavaznosti | to_entries[] | "| \(.key) | \(.value) |"' pocty.json
            echo
            echo "| Nástroj | Počet |"
            echo "|---|---|"
            jq -r '.podle_nastroje | to_entries[] | "| \(.key) | \(.value) |"' pocty.json
            echo
            echo "## Poslední analýzy"
            echo
            echo "| Datum | Commit | Nástroj | Výsledků |"
            echo "|---|---|---|---|"
            jq -r '.[] | "| \(.datum) | \(.commit) | \(.nastroj) | \(.vysledku) |"' analyzy.json
          } >> "$GITHUB_STEP_SUMMARY"
