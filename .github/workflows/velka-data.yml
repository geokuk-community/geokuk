name: Velká data

on:
  workflow_dispatch:
    inputs:
      gpx_kesi:
        description: "Keší v GPX (přídavných waypointů je zhruba stejně)"
        default: "100000"
      db_kesi:
        description: "Keší v databázi GeoGetu i GSAKu"
        default: "200000"
      db_wpt:
        description: "Přídavných waypointů v databázích"
        default: "200000"
      xmx:
        description: "Paměť programu (-Xmx)"
        default: "3g"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/velka-data.yml"

permissions:
  contents: read

jobs:
  velka-data:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Program s velkými daty
        shell: bash
        env:
          GPX_KESI: ${{ inputs.gpx_kesi || '100000' }}
          DB_KESI: ${{ inputs.db_kesi || '200000' }}
          DB_WPT: ${{ inputs.db_wpt || '200000' }}
          XMX: ${{ inputs.xmx || '3g' }}
        run: |
          vlastnosti=(-Dsmoke.velka.kesi="$GPX_KESI" -Dsmoke.db.kesi="$DB_KESI" -Dsmoke.db.wpt="$DB_WPT")
          [ -n "$XMX" ] && vlastnosti+=(-Dsmoke.xmx="$XMX")
          displej=()
          [ "$RUNNER_OS" = Linux ] && displej=(xvfb-run -a -s "-screen 0 1400x900x24")
          "${displej[@]}" ./mvnw -B -P smoke verify -Dtest=Zadny -Dsurefire.failIfNoSpecifiedTests=false \
            -Dit.test='SmokeIT#velkaData+velkaDatabazeGeogetu+velkaDatabazeGsaku' "${vlastnosti[@]}"

      - name: Souhrn
        if: always()
        shell: bash
        env:
          GPX_KESI: ${{ inputs.gpx_kesi || '100000' }}
          DB_KESI: ${{ inputs.db_kesi || '200000' }}
          DB_WPT: ${{ inputs.db_wpt || '200000' }}
          XMX: ${{ inputs.xmx || '3g' }}
        run: |
          hodnota() { grep -m1 "^$2=" "$1" 2>/dev/null | cut -d= -f2- | tr -d '\r'; }
          {
            echo "### Velká data na $RUNNER_OS"
            echo "GPX $GPX_KESI keší, databáze $DB_KESI keší + $DB_WPT waypointů, -Xmx ${XMX:-výchozí}"
            echo
            echo "| Data | Waypointů | Okno (ms) | Načtení keší (ms) | Paměť po scénáři (MB) | Špička paměti, odhad shora (MB) | Nejdelší událost EDT (ms) | Chyby |"
            echo "|---|---|---|---|---|---|---|---|"
            for beh in "velka:GPX" "geoget:GeoGet" "gsak:GSAK"; do
              z="target/smoke/${beh%%:*}/${beh%%:*}.properties"
              if [ -f "$z" ]; then
                chyby=$(grep -c '^\(chyba\|nezachycena\)\.' "$z" || true)
                echo "| ${beh#*:} | $(hodnota "$z" kese.wpt) | $(hodnota "$z" start.oknoMs) | $(hodnota "$z" start.keseMs) | $(hodnota "$z" pamet.mb) | $(hodnota "$z" pamet.spickaMb) | $(hodnota "$z" edt.nejdelsiMs) | $chyby |"
              else
                echo "| ${beh#*:} | bez výsledku (program nedoběhl, viz artefakt) | | | | | | |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Zprávy a logy
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: velka-data-${{ runner.os }}
          path: |
            target/smoke/*/*.properties
            target/smoke/*/*.log
            target/smoke/*/*.png
            target/smoke/*/*-diagnostika.txt
            target/smoke/*/data/log/
            target/failsafe-reports/
