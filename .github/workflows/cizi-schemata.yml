name: Schéma OpenSAKu

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      NAZEV: Schéma OpenSAKu se změnilo
    steps:
      - uses: actions/checkout@v7

      - name: Schéma OpenSAKu (main a beta)
        id: porovnani
        continue-on-error: true
        run: |
          rozdil=0
          : > rozdil.md
          for vetev in main beta; do
            git clone -q --depth 1 -b "$vetev" https://github.com/OpenSAK-Org/OpenSAK.git "opensak-$vetev"
            python3 .github/skripty/opensak_schema.py "opensak-$vetev" > "schema-$vetev.txt"
            # Přidané sloupce a vyšší verze schématu jsou jen informace v souhrnu běhu; chyba je jen sloupec, který GeoKuk čte.
            if python3 .github/skripty/opensak_zmeny.py src/test/resources/opensak-pouzite-sloupce.txt src/test/resources/opensak-schema.txt "schema-$vetev.txt" > "zprava-$vetev.md"; then
              stav=0
            else
              stav=$?
            fi
            {
              echo "### Větev \`$vetev\` ($(git -C "opensak-$vetev" rev-parse --short HEAD))"
              echo
              cat "zprava-$vetev.md"
              echo
            } | tee -a "$GITHUB_STEP_SUMMARY" > "uvod-$vetev.md"
            if [ "$stav" -ne 0 ]; then
              rozdil=1
              cat "uvod-$vetev.md" >> rozdil.md
            fi
          done
          exit $rozdil

      - name: Issue s výsledkem
        run: |
          CISLO=$(gh issue list --state open --search "in:title \"$NAZEV\"" --json number,title \
            --jq ".[] | select(.title == \"$NAZEV\") | .number" | head -1)
          if [ "${{ steps.porovnani.outcome }}" = success ]; then
            if [ -n "$CISLO" ]; then
              gh issue close "$CISLO" --comment "Schéma OpenSAKu obsahuje všechny sloupce, které GeoKuk čte ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            fi
            exit 0
          fi
          if [ ! -s rozdil.md ]; then
            echo "::error::Kontrola schématu nedoběhla, viz log kroku Schéma OpenSAKu."
            exit 1
          fi
          {
            echo "Týdenní kontrola $(date -u +%F): v databázi OpenSAKu chybí sloupce, které GeoKuk čte (seznam je v src/test/resources/opensak-pouzite-sloupce.txt)."
            echo
            cat rozdil.md
            echo "Upravte načítání OpenSAKu (OpensakDbLoader) a soubory se schématem; schéma se vypíše skriptem .github/skripty/opensak_schema.py."
            echo
            echo "Běh: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > telo.md
          if [ -n "$CISLO" ]; then
            gh issue edit "$CISLO" --body-file telo.md
          else
            gh issue create --title "$NAZEV" --body-file telo.md
          fi
          exit 1
