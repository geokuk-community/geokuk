name: Výkon

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Počet běhů"
        default: "7"

permissions:
  contents: read

jobs:
  rozpad:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Sestavení
        shell: bash
        run: ./mvnw -B -q package -DskipTests
      - name: Rozpad startu
        shell: bash
        run: |
          jar="$(ls target/geokuk-[0-9]*.jar | head -1)"
          python vykon/rozpad.py "$jar" "${{ inputs.n || '7' }}" | tee "${{ runner.temp }}/rozpad.txt"
          { echo "### Rozpad startu na $RUNNER_OS"; echo '```'; cat "${{ runner.temp }}/rozpad.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
