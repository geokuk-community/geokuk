name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verze:
        description: "Vydat verzi (např. 6.0.1-beta.3), jen z main; prázdné = jen build"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build a testy
        env:
          VSTUP: ${{ inputs.verze }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERZE="${GITHUB_REF_NAME#v}"
          elif [ -n "$VSTUP" ]; then
            echo "$VSTUP" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?' || { echo "Neplatná verze: $VSTUP"; exit 1; }
            VERZE="$VSTUP"
          else
            VERZE="$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml)-dev.$GITHUB_RUN_NUMBER"
          fi
          ./mvnw -B clean package -Dgeokuk.version="$VERZE" -Dgeokuk.commit="${GITHUB_SHA::7}"
          mv target/geokuk-*.jar target/geokuk.jar
          mv target/temporary-start.jar target/start.jar

      - name: Jar jako artefakt
        uses: actions/upload-artifact@v7
        with:
          name: geokuk-jar
          path: |
            target/geokuk.jar
            target/start.jar

  testy-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Testy
        run: ./mvnw.cmd -B test

  # Přenosná verze pro Windows: přibalená Java z Temurinu, jehož podepsaný javaw.exe jlink zachová.
  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            distribuce/windows
            .github/skripty

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/download-artifact@v8
        with:
          name: geokuk-jar

      - name: Zip s přibalenou Javou
        shell: pwsh
        run: |
          $moduly = "java.base,java.compiler,java.desktop,java.logging,java.management,java.naming,java.prefs,java.sql,java.xml," +
            "jdk.accessibility,jdk.charsets,jdk.crypto.ec,jdk.crypto.mscapi,jdk.httpserver,jdk.localedata,jdk.management,jdk.unsupported,jdk.zipfs"
          jlink --add-modules $moduly --strip-debug --no-header-files --no-man-pages --output GeoKuk/runtime
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $podpis = Get-AuthenticodeSignature GeoKuk/runtime/bin/javaw.exe
          if ($podpis.Status -ne "Valid") { throw "javaw.exe není podepsaný: $($podpis.Status)" }
          Copy-Item geokuk.jar, start.jar, distribuce/windows/GeoKuk.cmd, distribuce/windows/geokuk.ico, distribuce/windows/CTIMNE.txt GeoKuk/
          GeoKuk/runtime/bin/java -version
          Compress-Archive GeoKuk -DestinationPath GeoKuk-windows.zip

      - name: Zkouška zipu
        shell: pwsh
        run: .github/skripty/test-zipu.ps1 GeoKuk-windows.zip

      - name: Logy zkoušky zipu
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: zkouska-zipu
          path: ${{ runner.temp }}/zkouska-zipu/*/GeoKuk/data/log/

      - name: Zip jako artefakt
        uses: actions/upload-artifact@v7
        with:
          name: geokuk-windows
          path: GeoKuk-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.verze != '' && github.ref == 'refs/heads/main')
    needs: [build, testy-windows, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.verze) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            CHANGELOG.md
            src/main/resources/java.properties
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: geokuk-jar

      - uses: actions/download-artifact@v8
        with:
          name: geokuk-windows

      - name: Soubory pro stažení a aktualizaci
        run: |
          unzip -p geokuk.jar META-INF/MANIFEST.MF | tr -d "\r" | grep -qxF "Geokuk-Version: ${TAG#v}"
          cp src/main/resources/java.properties java.properties
          for f in geokuk.jar start.jar GeoKuk-windows.zip; do sha256sum "$f" > "$f.sha256"; done

      # Popis vydání je oddíl CHANGELOG.md pro verzi bez přípony (6.0.1-beta.3 → 6.0.1).
      - name: Popis vydání
        run: |
          VERZE="${TAG#v}"
          awk -v z="## ${VERZE%%-*}" '$0==z{f=1;next} /^## /{f=0} f' CHANGELOG.md \
            | perl -0pe 's/\n  +/ /g; s/\A\n+//' > popis.md
          cat popis.md

      # Release je neměnný, soubory jdou nahrát jen do konceptu před publikováním.
      # Při ručním vydání vznikne tag na sestaveném commitu až publikováním.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          if [ "$GITHUB_REF_TYPE" = tag ]; then CIL="--verify-tag"; else CIL="--target $GITHUB_SHA"; fi
          gh release create "$TAG" geokuk.jar geokuk.jar.sha256 start.jar start.jar.sha256 \
            GeoKuk-windows.zip GeoKuk-windows.zip.sha256 java.properties \
            --draft $CIL --title "$TAG" --notes-file popis.md $PRE
          gh release edit "$TAG" --draft=false
