name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build a testy
        run: ./mvnw -B clean package

      - name: Jar jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: geokuk-jar
          path: target/geokuk-*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: geokuk-jar

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: geokuk-*.jar
