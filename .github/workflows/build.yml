name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build a testy
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERZE="${GITHUB_REF_NAME#v}"
          else
            VERZE="$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml)-dev.$GITHUB_RUN_NUMBER"
          fi
          ./mvnw -B clean package -Dgeokuk.version="$VERZE" -Dgeokuk.commit="${GITHUB_SHA::7}"
          mv target/geokuk-*.jar target/geokuk.jar

      - name: Jar jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: geokuk-jar
          path: target/geokuk.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: geokuk-jar

      - name: Soubory pro stažení a aktualizaci
        run: |
          unzip -p geokuk.jar META-INF/MANIFEST.MF | tr -d "\r" | grep -qxF "Geokuk-Version: ${GITHUB_REF_NAME#v}"
          sha256sum geokuk.jar > geokuk.jar.sha256

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            geokuk.jar
            geokuk.jar.sha256
