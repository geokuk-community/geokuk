name: Build
# Prázdný název = výchozí název běhu podle události.
run-name: ${{ inputs.verze && format('Vydání {0} (spustil {1})', inputs.verze, github.triggering_actor) || '' }}

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, "release/**"]
  # Fronta slučování: build nad main + PR těsně před sloučením.
  merge_group:
  workflow_dispatch:
    inputs:
      verze:
        description: "Vydat verzi (např. 6.0.1-beta.3), jen z main nebo release/X.Y.x; prázdné = jen build"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build a testy
        env:
          VSTUP: ${{ inputs.verze }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERZE="${GITHUB_REF_NAME#v}"
          elif [ -n "$VSTUP" ]; then
            [[ $VSTUP =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || { echo "::error::Neplatná verze, platný tvar je X.Y.Z nebo X.Y.Z-beta.N."; exit 1; }
            case "$GITHUB_REF" in
              refs/heads/release/*)
                PREDPONA="${GITHUB_REF_NAME#release/}"; PREDPONA="${PREDPONA%x}"
                case "$VSTUP" in "$PREDPONA"*) ;; *) echo "Verze $VSTUP nepatří na větev $GITHUB_REF_NAME"; exit 1 ;; esac ;;
            esac
            VERZE="$VSTUP"
          else
            VERZE="$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml)-dev.$GITHUB_RUN_NUMBER"
          fi
          ./mvnw -B clean org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent verify org.jacoco:jacoco-maven-plugin:0.8.12:report -Dgeokuk.version="$VERZE" -Dgeokuk.commit="${GITHUB_SHA::7}"
          mv target/geokuk-*.jar target/geokuk.jar
          mv target/temporary-start.jar target/start.jar

      - name: Mapové téma pro aplikace
        run: |
          python3 -I nastroje/tema/sestav-tema.py target/geokuk.jar target/tema
          # Témata v resources musí odpovídat generátoru.
          R=src/main/resources/cz/geokuk/plugins/mapy/kachle/podklady
          diff -r "$R/geokuk" target/tema/geokuk
          diff "$R/trasy.xml" target/tema/trasy.xml
          mv target/tema/GeoKuk-tema.zip target/tema/GeoKuk-tema-PAWS.zip target/
          # Zipy se načtou tak, jak je čtou aplikace (ZipXmlThemeResourceProvider).
          ./mvnw -B -o surefire:test -Dtest=TemaZipTest -Dgeokuk.tema.zip=target -Dsurefire.failIfNoSpecifiedTests=false

      - name: Pokrytí testy
        if: always()
        run: |
          [ -f target/site/jacoco/jacoco.csv ] || exit 0
          awk -F, 'NR > 1 { lm += $8; lc += $9; bm += $6; bc += $7 } END {
            printf "### Pokrytí testy\n\n| | pokryto |\n|---|---|\n| řádky | %.1f %% (%d z %d) |\n| větve | %.1f %% (%d z %d) |\n",
              100 * lc / (lc + lm), lc, lc + lm, 100 * bc / (bc + bm), bc, bc + bm }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Pokrytí, SpotBugs a rozdíly snímků jako artefakt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pokryti-a-spotbugs
          path: |
            target/site/jacoco/
            target/spotbugsXml.xml
            target/golden/
          if-no-files-found: ignore

      - name: Jar jako artefakt
        uses: actions/upload-artifact@v7
        with:
          name: geokuk-jar
          path: |
            target/geokuk.jar
            target/start.jar
            target/GeoKuk-tema.zip
            target/GeoKuk-tema-PAWS.zip

  testy-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Testy
        run: ./mvnw.cmd -B test

  # Přenosná verze pro Windows: přibalená Java z Temurinu, jehož podepsaný javaw.exe jlink zachová.
  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            distribuce/windows
            distribuce/offline-mapy
            .github/skripty
            priklady
            licence
            src/main/resources

      # Přibalená Java: vždy poslední vydaná Temurin 21, ne starší z cache runneru.
      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          check-latest: true

      - uses: actions/download-artifact@v8
        with:
          name: geokuk-jar

      - name: Zip s přibalenou Javou
        shell: pwsh
        run: |
          $moduly = "java.base,java.compiler,java.desktop,java.logging,java.management,java.naming,java.prefs,java.sql,java.xml," +
            "jdk.accessibility,jdk.charsets,jdk.crypto.ec,jdk.crypto.mscapi,jdk.httpserver,jdk.localedata,jdk.management,jdk.unsupported,jdk.zipfs"
          jlink --add-modules $moduly --strip-debug --no-header-files --no-man-pages --generate-cds-archive --output GeoKuk/program/runtime
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $podpis = Get-AuthenticodeSignature GeoKuk/program/runtime/bin/javaw.exe
          if ($podpis.Status -ne "Valid") { throw "javaw.exe není podepsaný: $($podpis.Status)" }
          Copy-Item geokuk.jar, start.jar, distribuce/windows/geokuk.ico GeoKuk/program/
          Copy-Item distribuce/windows/GeoKuk-prvni-spusteni.cmd, distribuce/windows/CTIMNE.txt GeoKuk/
          New-Item -ItemType Directory GeoKuk/licence | Out-Null
          Copy-Item LICENSE, licence/* GeoKuk/licence/
          New-Item -ItemType Directory GeoKuk/data/offline-mapy | Out-Null
          Copy-Item distribuce/offline-mapy/* GeoKuk/data/offline-mapy/
          GeoKuk/program/runtime/bin/java -version
          $java = (Select-String -Path GeoKuk/program/runtime/release -Pattern '^JAVA_VERSION="(.+)"').Matches[0].Groups[1].Value
          $doporucena = (Select-String -Path src/main/resources/java.properties -Pattern '^doporucena=(.+)$').Matches[0].Groups[1].Value.Trim()
          "Přibalená Java $java, doporučená $doporucena" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if (-not $java.StartsWith("21.")) { throw "Přibalená Java $java není 21" }
          if ([version]$java -lt [version]$doporucena) { throw "Přibalená Java $java je starší než doporučená $doporucena" }
          Compress-Archive GeoKuk -DestinationPath GeoKuk-windows.zip

      - name: Zkouška zipu
        shell: pwsh
        run: .github/skripty/test-zipu.ps1 GeoKuk-windows.zip

      - name: Logy zkoušky zipu
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: zkouska-zipu
          path: ${{ runner.temp }}/zkouska-zipu/*/GeoKuk/data/log/

      - name: Zip jako artefakt
        uses: actions/upload-artifact@v7
        with:
          name: geokuk-windows
          path: GeoKuk-windows.zip

  # Kontroly před schválením vydání; když selže, job release se ke schválení nedostane.
  kontrola-vydani:
    if: github.event_name == 'workflow_dispatch' && inputs.verze != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Kontrola vydání
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ inputs.verze }}
          SPUSTIL: ${{ github.triggering_actor }}
        run: .github/skripty/kontrola-vydani.sh

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.verze != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    needs: [kontrola-vydani, build, testy-windows, windows]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ inputs.verze }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: v${{ inputs.verze }}
    steps:
      - name: Verze do souhrnu
        env:
          SPUSTIL: ${{ github.triggering_actor }}
        run: echo "### Vydání ${TAG#v} (spustil $SPUSTIL)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            CHANGELOG.md
            src/main/resources/java.properties
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: geokuk-jar

      - uses: actions/download-artifact@v8
        with:
          name: geokuk-windows

      - name: Soubory pro stažení a aktualizaci
        run: |
          unzip -p geokuk.jar META-INF/MANIFEST.MF | tr -d "\r" | grep -qxF "Geokuk-Version: ${TAG#v}"
          cp src/main/resources/java.properties java.properties
          for f in geokuk.jar start.jar GeoKuk-windows.zip GeoKuk-tema.zip GeoKuk-tema-PAWS.zip; do sha256sum "$f" > "$f.sha256"; done

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            geokuk.jar
            start.jar
            GeoKuk-windows.zip
            GeoKuk-tema.zip
            GeoKuk-tema-PAWS.zip
            java.properties

      # Popis vydání je oddíl CHANGELOG.md pro verzi bez přípony (6.0.1-beta.3 → 6.0.1).
      - name: Popis vydání
        run: |
          VERZE="${TAG#v}"
          awk -v z="## ${VERZE%%-*}" '$0==z{f=1;next} /^## /{f=0} f' CHANGELOG.md \
            | perl -0pe 's/\n  +/ /g; s/\A\n+//' > popis.md
          cat popis.md

      # Release je neměnný, soubory jdou nahrát jen do konceptu před publikováním.
      # Tag vzniká předem na sestaveném commitu; když mezitím vznikl jinde, založení selže.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRIZNAK=""
          case "$TAG" in *-*) PRIZNAK="--prerelease" ;; esac
          # Vydání starší řady (např. 6.4.1 po 6.5.0) nesmí být „latest“, jinak by updater a stránka ke stažení couvly.
          if [ -z "$PRIZNAK" ]; then
            if ODPOVED=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>&1); then
              LATEST="$ODPOVED"
            elif printf '%s' "$ODPOVED" | grep -q 'HTTP 404'; then
              LATEST=""
            else
              echo "Dotaz na poslední vydání selhal: $ODPOVED"
              exit 1
            fi
            if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "${LATEST#v}" "${TAG#v}" | sort -V | tail -n1)" != "${TAG#v}" ]; then
              PRIZNAK="--latest=false"
            fi
          fi
          if ODPOVED=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" 2>&1) || ! printf '%s' "$ODPOVED" | grep -q 'HTTP 404'; then
            echo "::error::Tag $TAG už existuje nebo dotaz na něj selhal, vydání se nezaloží: $ODPOVED"
            exit 1
          fi
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          SHA_TAGU=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)
          if [ "$SHA_TAGU" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG ukazuje na $SHA_TAGU, ne na sestavený commit $GITHUB_SHA."
            exit 1
          fi
          gh release create "$TAG" geokuk.jar geokuk.jar.sha256 start.jar start.jar.sha256 \
            GeoKuk-windows.zip GeoKuk-windows.zip.sha256 GeoKuk-tema.zip GeoKuk-tema.zip.sha256 GeoKuk-tema-PAWS.zip GeoKuk-tema-PAWS.zip.sha256 java.properties \
            --draft --verify-tag --title "$TAG" --notes-file popis.md $PRIZNAK
          gh release edit "$TAG" --draft=false $PRIZNAK
